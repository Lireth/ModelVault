# ModelVault 持续集成工作流（CI）
#
# 触发条件：推送到 main 分支、针对 main 的 PR、手动触发
# 职责：依赖安装 → 运行时依赖漏洞审计 → ESLint → 类型检查（shared 契约层 +
#   preload）→ 单元测试 → 三端编译 → 编译产物完整性校验 → 启动冒烟
#   （out/ 与 win-unpacked）→ 覆盖率报告归档；PR 另做依赖差分审查
#   （dependency-review）。CodeQL 静态扫描见独立的 codeql.yml。
# 与 release.yml 的分工：本工作流只做质量门禁与目录产物（--dir）启动冒烟，
#   不生成便携版/安装包、不发布；正式产物由推送 v* 标签触发的 release.yml 负责。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read # 最小权限原则：CI 只需读取代码，无需写仓库

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同分支新推送自动取消旧任务，节省构建资源

jobs:
  # OP-08：PR 依赖差分审查（新增/升级依赖引入的高危漏洞阻断合并）。
  # 仅 PR 触发；依赖 Dependabot 已有的版本更新流程。
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 依赖差分审查
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  test-and-build:
    name: Test & Build (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 20
    # D6：engines 声明 >=22.22.2（jsdom 30 强制要求，Node 20 已 EOL），
    # 矩阵覆盖 22/24 双版本验证（避免纸面承诺）
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      # ---------- 环境准备 ----------

      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm # 缓存 npm 依赖包

      # 缓存 Electron / electron-builder 二进制（.npmrc 指向 npmmirror 镜像，
      # 首次下载约 100MB+，缓存后大幅加速）。键随 lock 文件变化自动失效。
      - name: 缓存 Electron 二进制
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ---------- 依赖安装 ----------

      - name: 安装依赖
        run: npm ci

      # OP-08 供应链门禁：只审计运行时依赖（vue / fflate），避免 devDependencies
      # 的噪音；.npmrc 指向的镜像不提供 audit 端点，显式使用官方 registry。
      # high 及以上漏洞阻断构建，其余等级输出告警供人工评估。
      - name: 运行时依赖漏洞审计
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::运行时依赖存在 high 及以上漏洞，请升级或替换后重试"
            exit 1
          }

      # ---------- 测试与构建 ----------

      # D1 代码质量门禁：ESLint（flat config，错误级规则）不通过则终止 CI
      - name: ESLint 代码检查
        run: npm run lint

      # O10 渐进式类型门禁：TypeScript checkJs 覆盖 shared 契约层、preload、
      # main 全层与 renderer 全部 JS（.vue 模板由组件测试覆盖），捕获字段漂移类回归；
      # strict 渐进收紧，新增文件默认纳入检查范围
      - name: 类型检查（shared / preload / main / renderer JS）
        run: npm run typecheck

      # 覆盖率统计的 instrumentation 有明显开销：仅在 Node 22 基准腿生成
      # 报告并归档；Node 24 兼容性腿跑普通测试，缩短矩阵总时长
      - name: 运行单元测试（含覆盖率统计，D6）
        if: matrix.node == '22'
        run: npm run test:coverage

      - name: 运行单元测试（Node 24 兼容性腿）
        if: matrix.node == '24'
        run: npm test

      - name: 编译主进程 / preload / 渲染进程
        run: npm run build

      # ---------- 构建产物验证 ----------

      - name: 验证编译产物
        shell: pwsh
        run: |
          $required = @(
            "out/main/index.js",
            "out/preload/index.js",
            "out/renderer/index.html"
          )

          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::编译产物缺失: $($missing -join ', ')"
            Get-ChildItem out -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "编译产物完整: main / preload / renderer 三端入口均存在"

      # ---------- 启动冒烟（V-05） ----------

      # 编译产物冒烟：真实启动 Electron，验证主窗口/生产页面加载/preload+
      # IPC 往返/自定义图片协议。仅 Node 22 基准腿执行，避免矩阵重复耗时。
      - name: 启动冒烟（out/ 编译产物）
        if: matrix.node == '22'
        run: npm run smoke

      # 目录产物冒烟：electron-builder --dir 生成 win-unpacked（asar 路径、
      # 打包后资源解析与开发态不同），再以真实 exe 走同一套检查。
      - name: 打包目录产物（不生成安装包）
        if: matrix.node == '22'
        run: npx electron-builder --dir --publish never

      - name: 启动冒烟（win-unpacked 打包产物）
        if: matrix.node == '22'
        run: node scripts/smoke.mjs --packaged

      # ---------- 构建产物与覆盖率归档 ----------

      # test:coverage 生成的报告归档到运行页面，便于追溯历史覆盖率变化；
      # 若前置步骤（lint/测试）失败导致目录不存在，仅告警不阻断 CI
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      # ---------- 结果通知 ----------

      # 无论成败均写入 Job Summary；失败时额外输出 ::error:: 注解，
      # 在 Actions 页面与检查结果中高亮显示
      - name: 写入 CI 结果摘要
        if: always()
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          NODE_VERSION: ${{ matrix.node }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $url = $env:RUN_URL
          $ok = "${{ job.status }}" -eq "success"
          $result = if ($ok) { "✅ 通过" } else { "❌ 失败" }
          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ## CI 结果：$result（Node $env:NODE_VERSION）

          - 触发者：``$env:ACTOR``
          - 提交：``$env:SHA``
          - [查看运行日志]($url)
          "@
          if (-not $ok) {
            Write-Host "::error::CI 失败（分支 ${{ github.ref_name }}，Node $env:NODE_VERSION），请查看日志: $url"
          }
