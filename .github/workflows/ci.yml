# ModelVault 持续集成工作流（CI）
#
# 触发条件：推送到 main 分支、针对 main 的 PR、每周一定时依赖审计巡检、手动触发
# 职责：Node 24 单腿全量门禁——依赖安装 → 运行时依赖漏洞审计 → ESLint →
#   Prettier 格式检查 → 类型检查（shared 契约层 + preload + main + renderer）
#   → 单元测试（含覆盖率）→ 三端编译 → 编译产物完整性校验 → 启动冒烟
#   （out/ 与 win-unpacked）→ 覆盖率报告归档。PR 另做依赖差分审查
#   （dependency-review，含 license 白名单）。CodeQL 静态扫描见独立的
#   codeql.yml。
# 定时巡检（scheduled-dependency-audit）：门内审计只在 push/PR 时执行，
#   main 长期无推送时 lockfile 新增披露 CVE 无检测入口——每周一仅跑
#   lockfile 依赖审计（免安装依赖），不拉起完整门禁。
# Node 版本说明：engines 声明 >=22.22.2（jsdom 30 强制要求，Node 20 已
#   EOL）。CI 仅以 Node 24（当前 LTS）执行门禁：此前的 22/24 双腿矩阵中
#   22 承担全量门禁、24 仅复跑测试，而静态检查/测试/编译产物只依赖源码
#   与 lock 文件、不随 Node 版本漂移，双跑纯属重复耗时——合并单腿后运行
#   器时间约减半；22 兼容性由 engines 字段在安装侧约束（npm 版本越界告警）。
#   O-6 口径统一：release.yml 打包腿同为 Node 24（原「沿用 22」为历史遗留），
#   验证环境与出货构建环境一致，CI 绿即出货链路环境已逐 PR 验证。
# 与 release.yml 的分工：本工作流只做质量门禁与目录产物（--dir）启动冒烟，
#   不生成便携版/安装包、不发布；正式产物由推送 v* 标签触发的 release.yml 负责。

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 每周一 04:00 UTC（北京时间 12:00）依赖审计巡检，与 CodeQL（03:00）
    # 错峰；覆盖两次推送之间新披露的 CVE
    - cron: '0 4 * * 1'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read # 最小权限原则：CI 只需读取代码，无需写仓库

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 同分支新推送自动取消旧任务，节省构建资源

jobs:
  # OP-08：PR 依赖差分审查（新增/升级依赖引入的高危漏洞阻断合并）。
  # 仅 PR 触发；依赖 Dependabot 已有的版本更新流程。
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 依赖差分审查
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # 本项目 GPL-3.0：入向依赖仅接受宽松/公有领域协议与 GPL 家族
          # （GPL 项目可合规引入同族 copyleft 依赖）。仅审查 PR 中变化的
          # 依赖，存量树已核对全部命中白名单
          allow-licenses: >-
            MIT, MIT-0, ISC, Apache-2.0, 0BSD, BSD-2-Clause, BSD-3-Clause,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Unlicense, WTFPL, Python-2.0,
            Zlib, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only,
            GPL-3.0-or-later, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only,
            LGPL-3.0-or-later

  # 定时依赖审计巡检：--package-lock-only 直接读 lockfile（免安装依赖、
  # 免拉 Electron 二进制），口径与门内审计一致——运行时依赖 high 及以上
  # 阻断并注解告警；全树（含 devDependencies）仅输出到 Job Summary 供
  # 人工评估，不阻断，避免与门内「只审运行时依赖」的降噪口径冲突。
  # .npmrc 指向的镜像不提供 audit 端点，显式使用官方 registry。
  scheduled-dependency-audit:
    name: Scheduled Dependency Audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 运行时依赖审计（high 及以上阻断）
        run: |
          if npm audit --omit=dev --audit-level=high \
              --registry=https://registry.npmjs.org --package-lock-only; then
            echo "✅ 运行时依赖（package-lock）无 high 及以上漏洞" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::运行时依赖存在新披露的 high 及以上漏洞，请通过 Dependabot PR 或手动升级处理后验证"
            exit 1
          fi

      - name: 全树审计提示（含 devDependencies，不阻断）
        run: |
          npm audit --audit-level=moderate \
            --registry=https://registry.npmjs.org --package-lock-only \
            > audit-full.txt 2>&1 || true
          {
            echo ''
            echo '## 全树依赖审计提示（含 devDependencies，仅提示）'
            echo '```text'
            cat audit-full.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f audit-full.txt

  test-and-build:
    name: Test & Build (Node 24)
    # 定时触发只做依赖审计巡检，不拉起完整门禁（Windows 全量构建无需为例行
    # 审计重复执行；push/PR/dispatch 仍走全量）
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      # ---------- 环境准备 ----------

      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm # 缓存 npm 依赖包

      # 缓存 Electron / electron-builder 二进制（.npmrc 指向 npmmirror 镜像，
      # 首次下载约 100MB+，缓存后大幅加速）。键随 lock 文件变化自动失效。
      - name: 缓存 Electron 二进制
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ---------- 依赖安装 ----------

      - name: 安装依赖
        run: npm ci

      # OP-08 供应链门禁：只审计运行时依赖（vue / fflate），避免 devDependencies
      # 的噪音；.npmrc 指向的镜像不提供 audit 端点，显式使用官方 registry。
      # high 及以上漏洞阻断构建，其余等级输出告警供人工评估。
      - name: 运行时依赖漏洞审计
        shell: pwsh
        run: |
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::运行时依赖存在 high 及以上漏洞，请升级或替换后重试"
            exit 1
          }

      # ---------- 测试与构建 ----------

      # D1 代码质量门禁：ESLint（flat config，错误级规则）不通过则终止 CI。
      # 静态检查只依赖源码，置于慢速测试前快速失败
      - name: ESLint 代码检查
        run: npm run lint

      # 格式门禁：ESLint 已配 eslint-config-prettier 关闭风格类规则，格式
      # 一致性由 Prettier 单独把关（本地 `npm run format` 修复）
      - name: Prettier 格式检查
        run: npm run format:check

      # O10 渐进式类型门禁：TypeScript checkJs 覆盖 shared 契约层、preload、
      # main 全层与 renderer 全部 JS（.vue 模板由组件测试覆盖），捕获字段漂移类回归；
      # strict 渐进收紧，新增文件默认纳入检查范围
      - name: 类型检查（shared / preload / main / renderer JS）
        run: npm run typecheck

      # 覆盖率统计的 instrumentation 有明显开销，但门禁阈值（见
      # vitest.config.mjs）随测试执行强制生效，报告归档到运行页面供追溯
      - name: 运行单元测试（含覆盖率统计）
        run: npm run test:coverage

      # ---------- 编译产物验证 ----------

      - name: 编译主进程 / preload / 渲染进程
        run: npm run build

      - name: 验证编译产物
        shell: pwsh
        run: |
          $required = @(
            "out/main/index.js",
            "out/preload/index.js",
            "out/renderer/index.html"
          )

          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::编译产物缺失: $($missing -join ', ')"
            Get-ChildItem out -Recurse -File | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "编译产物完整: main / preload / renderer 三端入口均存在"

      # ---------- 启动冒烟（V-05） ----------

      # 编译产物冒烟：真实启动 Electron，验证主窗口/生产页面加载/preload+
      # IPC 往返/自定义图片协议。
      - name: 启动冒烟（out/ 编译产物）
        run: npm run smoke

      # 目录产物冒烟：electron-builder --dir 生成 win-unpacked（asar 路径、
      # 打包后资源解析与开发态不同），再以真实 exe 走同一套检查。
      - name: 打包目录产物（不生成安装包）
        run: npx electron-builder --dir --publish never

      - name: 启动冒烟（win-unpacked 打包产物）
        run: node scripts/smoke.mjs --packaged

      # ---------- 构建产物与覆盖率归档 ----------

      # test:coverage 生成的报告归档到运行页面，便于追溯历史覆盖率变化；
      # if: always() 使测试失败时报告仍可上传，供排查覆盖率退化；若前置
      # 步骤失败导致目录不存在，仅告警不阻断 CI
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      # ---------- 结果通知 ----------

      # 无论成败均写入 Job Summary；失败时额外输出 ::error:: 注解，
      # 在 Actions 页面与检查结果中高亮显示
      - name: 写入 CI 结果摘要
        if: always()
        shell: pwsh
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $url = $env:RUN_URL
          $ok = "${{ job.status }}" -eq "success"
          $result = if ($ok) { "✅ 通过" } else { "❌ 失败" }
          Add-Content $env:GITHUB_STEP_SUMMARY @"
          ## CI 结果：$result（Node 24）

          - 触发者：``$env:ACTOR``
          - 提交：``$env:SHA``
          - [查看运行日志]($url)
          "@
          if (-not $ok) {
            Write-Host "::error::CI 失败（分支 ${{ github.ref_name }}，Node 24），请查看日志: $url"
          }
