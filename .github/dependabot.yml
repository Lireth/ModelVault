# 依赖更新自动化（D6）：
# - npm 依赖每周一检查；开发依赖的补丁/次版本升级合并为一个 PR 降低审查噪音；
#   Electron 与 electron-builder 的大版本升级影响运行时与打包链路，需人工
#   验证后再手动合入，Dependabot 不自动开 PR（见下方 ignore 规则）
# - GitHub Actions 工作流版本每周一检查
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # 开发依赖（eslint/vite/vitest 等 15+ 个）的 patch/minor 合入同一 PR；
      # 主版本升级 breaking 风险高，仍单独成 PR 便于逐个审查
      dev-dependencies-minor:
        dependency-type: "development"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
    ignore:
      # 运行时 Electron 与打包工具链大版本需人工确认后升级
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "ci(deps)"
